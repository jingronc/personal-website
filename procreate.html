<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Page layout ── */
    .procreate-page {
      min-height: 100vh;
      padding: 5rem 0 6rem;
      position: relative;
      overflow: hidden;
    }

    .page-header {
      text-align: center;
      margin-bottom: 3.5rem;
      position: relative;
      z-index: 1;
    }

    .page-header .section-title {
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      margin-bottom: 0.6rem;
    }

    .page-header .page-sub {
      color: var(--text-muted);
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      letter-spacing: 0.04em;
    }

    /* ── Back link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3rem;
      transition: color 0.2s;
      position: relative;
      z-index: 1;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { width: 15px; height: 15px; }

    /* ── Masonry gallery ── */
    .gallery-masonry {
      columns: 3;
      column-gap: 1.25rem;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 800px) { .gallery-masonry { columns: 2; } }
    @media (max-width: 480px) { .gallery-masonry { columns: 1; } }

    /* ── Art card ── */
    .art-card {
      break-inside: avoid;
      margin-bottom: 1.25rem;
      background: #faf8f5;
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.25),
        0 8px 32px rgba(0,0,0,0.35);
      cursor: pointer;
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 0.55s ease,
        transform 0.55s ease,
        box-shadow 0.3s ease;
    }

    .art-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .art-card:hover {
      box-shadow:
        0 8px 24px rgba(0,0,0,0.4),
        0 16px 48px rgba(0,0,0,0.35),
        0 0 0 1px rgba(58,175,169,0.3),
        0 0 30px rgba(58,175,169,0.12);
      transform: translateY(-5px);
    }

    .art-card img {
      display: block;
      width: 100%;
      height: auto;
    }

    .art-card-label {
      padding: 0.65rem 1rem 0.8rem;
      background: #faf8f5;
      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .art-card-label span {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7a6a5a;
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 10, 18, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-img {
      max-width: min(90vw, 700px);
      max-height: 88vh;
      width: auto;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.7);
      transform: scale(0.94);
      transition: transform 0.3s ease;
    }

    .lightbox.open .lightbox-img {
      transform: scale(1);
    }

    .lightbox-close {
      position: fixed;
      top: 1.5rem;
      right: 1.75rem;
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      transition: color 0.2s;
      z-index: 501;
    }
    .lightbox-close:hover { color: #fff; }

    .lightbox-caption {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      z-index: 501;
    }

    /* ── Stagger delays ── */
    .art-card:nth-child(1) { transition-delay: 0.05s; }
    .art-card:nth-child(2) { transition-delay: 0.12s; }
    .art-card:nth-child(3) { transition-delay: 0.19s; }
    .art-card:nth-child(4) { transition-delay: 0.26s; }
    .art-card:nth-child(5) { transition-delay: 0.33s; }
  </style>
</head>
<body>

  <!-- HAMBURGER -->
  <button class="hamburger dark fade-in" id="hamburger" aria-label="Open menu">
    <span></span>
    <span></span>
  </button>

  <!-- MENU OVERLAY -->
  <div class="menu-overlay" id="menuOverlay">
    <nav class="menu-nav">
      <a href="index.html#about"   class="menu-link">About Me</a>
      <a href="procreate.html"     class="menu-link active">Procreate Art</a>
      <a href="film-shots.html"    class="menu-link">Film Shots</a>
    </nav>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="" />
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>

  <!-- BUBBLES -->
  <canvas id="bubbleCanvas" class="visible"></canvas>

  <main class="procreate-page">
    <div class="ambient-light"></div>
    <div class="ambient-light ambient-light--right"></div>
    <div class="container">

      <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polyline points="15 18 9 12 15 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </a>

      <div class="page-header">
        <h1 class="section-title">Procreate Art</h1>
        <p class="page-sub">Watercolor food illustrations · iPad · 2020–present</p>
      </div>

      <div class="gallery-masonry" id="gallery">

        <div class="art-card" data-src="Procreate%20Portfolio/Cherry.JPG" data-label="Cherry Danish">
          <img src="Procreate%20Portfolio/Cherry.JPG" alt="Cherry Danish" loading="lazy" />
          <div class="art-card-label"><span>Cherry Danish</span></div>
        </div>

        <div class="art-card" data-src="Procreate%20Portfolio/crossot.PNG" data-label="Croissant">
          <img src="Procreate%20Portfolio/crossot.PNG" alt="Croissant" loading="lazy" />
          <div class="art-card-label"><span>Croissant</span></div>
        </div>

        <div class="art-card" data-src="Procreate%20Portfolio/Bun.JPG" data-label="Ebi Nigiri">
          <img src="Procreate%20Portfolio/Bun.JPG" alt="Ebi Nigiri" loading="lazy" />
          <div class="art-card-label"><span>Ebi Nigiri</span></div>
        </div>

        <div class="art-card" data-src="Procreate%20Portfolio/Bread_2.JPG" data-label="Bread Roll">
          <img src="Procreate%20Portfolio/Bread_2.JPG" alt="Bread Roll" loading="lazy" />
          <div class="art-card-label"><span>Bread Roll</span></div>
        </div>

        <div class="art-card" data-src="Procreate%20Portfolio/Yellow_Bun.JPG" data-label="Yellow Bun">
          <img src="Procreate%20Portfolio/Yellow_Bun.JPG" alt="Yellow Bun" loading="lazy" />
          <div class="art-card-label"><span>Yellow Bun</span></div>
        </div>

      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Made with 💙 by Jingrong Chen</p>
  </footer>

  <script>
    // ── Hamburger ──
    const hamburger   = document.getElementById('hamburger');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuLinks   = document.querySelectorAll('.menu-link');

    hamburger.addEventListener('click', () => {
      const isOpen = menuOverlay.classList.toggle('is-open');
      hamburger.classList.toggle('is-open', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });
    menuLinks.forEach(link => {
      link.addEventListener('click', () => {
        menuOverlay.classList.remove('is-open');
        hamburger.classList.remove('is-open');
        document.body.style.overflow = '';
      });
    });

    // ── Scroll reveal for cards ──
    const cards = document.querySelectorAll('.art-card');
    const revealObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    cards.forEach(card => revealObserver.observe(card));

    // ── Lightbox ──
    const lightbox        = document.getElementById('lightbox');
    const lightboxImg     = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');
    const lightboxClose   = document.getElementById('lightboxClose');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        lightboxImg.src = card.dataset.src;
        lightboxImg.alt = card.dataset.label;
        lightboxCaption.textContent = card.dataset.label;
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // ── Bubbles ──
    const canvas = document.getElementById('bubbleCanvas');
    const ctx    = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize, { passive: true });

    function randomBubble() {
      return {
        x:       Math.random() * canvas.width,
        y:       canvas.height + Math.random() * 200,
        r:       Math.random() * 3 + 1,
        speed:   Math.random() * 0.5 + 0.2,
        opacity: Math.random() * 0.35 + 0.05,
        drift:   (Math.random() - 0.5) * 0.4,
      };
    }

    const bubbles = [];
    for (let i = 0; i < 80; i++) {
      const b = randomBubble();
      b.y = Math.random() * canvas.height;
      bubbles.push(b);
    }

    function drawBubble(b) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(94, 207, 218, ${b.opacity})`;
      ctx.lineWidth   = 0.8;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180, 240, 245, ${b.opacity * 0.5})`;
      ctx.fill();

      b.y -= b.speed;
      b.x += b.drift;
      if (b.y + b.r < 0) Object.assign(b, randomBubble());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      bubbles.forEach(drawBubble);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
