  <style>
    /* ── Page layout ── */
    .film-page {
      min-height: 100vh;
      padding: 5rem 0 6rem;
      position: relative;
      overflow: hidden;
    }

    .page-header {
      text-align: center;
      margin-bottom: 3.5rem;
      position: relative;
      z-index: 1;
    }

    .page-header .section-title {
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      margin-bottom: 0.6rem;
    }

    .page-header .page-sub {
      color: var(--text-muted);
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      letter-spacing: 0.04em;
    }

    /* ── Back link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3rem;
      transition: color 0.2s;
      position: relative;
      z-index: 1;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { width: 15px; height: 15px; }

    /* ── Masonry gallery ── */
    .gallery-masonry {
      columns: 2;
      column-gap: 1.25rem;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 600px) { .gallery-masonry { columns: 1; } }

    /* ── Photo card ── */
    .art-card {
      break-inside: avoid;
      margin-bottom: 1.25rem;
      background: #0a0a0a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.25),
        0 8px 32px rgba(0,0,0,0.35);
      cursor: pointer;
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 0.55s ease,
        transform 0.55s ease,
        box-shadow 0.3s ease;
    }

    .art-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .art-card:hover {
      box-shadow:
        0 8px 24px rgba(0,0,0,0.4),
        0 16px 48px rgba(0,0,0,0.35),
        0 0 0 1px rgba(58,175,169,0.3),
        0 0 30px rgba(58,175,169,0.12);
      transform: translateY(-5px);
    }

    .art-card img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 5, 10, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-img {
      max-width: min(90vw, 900px);
      max-height: 88vh;
      width: auto;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.8);
      transform: scale(0.94);
      transition: transform 0.3s ease;
    }

    .lightbox.open .lightbox-img {
      transform: scale(1);
    }

    .lightbox-close {
      position: fixed;
      top: 1.5rem;
      right: 1.75rem;
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      transition: color 0.2s;
      z-index: 501;
    }
    .lightbox-close:hover { color: #fff; }

    /* ── Stagger delays ── */
    .art-card:nth-child(1)  { transition-delay: 0.05s; }
    .art-card:nth-child(2)  { transition-delay: 0.10s; }
    .art-card:nth-child(3)  { transition-delay: 0.15s; }
    .art-card:nth-child(4)  { transition-delay: 0.20s; }
    .art-card:nth-child(5)  { transition-delay: 0.25s; }
    .art-card:nth-child(6)  { transition-delay: 0.30s; }
    .art-card:nth-child(7)  { transition-delay: 0.35s; }
    .art-card:nth-child(8)  { transition-delay: 0.40s; }
    .art-card:nth-child(9)  { transition-delay: 0.45s; }
    .art-card:nth-child(10) { transition-delay: 0.50s; }
  </style>
</head>
<body>

  <!-- HAMBURGER -->
  <button class="hamburger dark fade-in" id="hamburger" aria-label="Open menu">
    <span></span>
    <span></span>
  </button>

  <!-- MENU OVERLAY -->
  <div class="menu-overlay" id="menuOverlay">
    <nav class="menu-nav">

  <!-- LIGHTBOX -->

      <div class="page-header">

      </div>

        </div>

  <footer class="footer">
    <p>Made with 💙 by Jingrong Chen</p>

  <script>
    // ── Hamburger ──
    const hamburger   = document.getElementById('hamburger');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuLinks   = document.querySelectorAll('.menu-link');

    hamburger.addEventListener('click', () => {
      const isOpen = menuOverlay.classList.toggle('is-open');
      hamburger.classList.toggle('is-open', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });
    menuLinks.forEach(link => {
      link.addEventListener('click', () => {
        menuOverlay.classList.remove('is-open');
        hamburger.classList.remove('is-open');
        document.body.style.overflow = '';
      });
    });

    // ── Scroll reveal for cards ──
    const cards = document.querySelectorAll('.art-card');
    const revealObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    cards.forEach(card => revealObserver.observe(card));

    // ── Lightbox ──
    const lightbox      = document.getElementById('lightbox');
    const lightboxImg   = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        lightboxImg.src = card.dataset.src;
        lightboxImg.alt = 'Film Shot';
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // ── Bubbles ──
    const canvas = document.getElementById('bubbleCanvas');
    const ctx    = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize, { passive: true });

    function randomBubble() {
      return {
        x:       Math.random() * canvas.width,
        y:       canvas.height + Math.random() * 200,
        r:       Math.random() * 3 + 1,
        speed:   Math.random() * 0.5 + 0.2,
        opacity: Math.random() * 0.35 + 0.05,
        drift:   (Math.random() - 0.5) * 0.4,
      };
    }

    const bubbles = [];
    for (let i = 0; i < 80; i++) {
      const b = randomBubble();
      b.y = Math.random() * canvas.height;
      bubbles.push(b);
    }

    function drawBubble(b) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(94, 207, 218, ${b.opacity})`;
      ctx.lineWidth   = 0.8;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180, 240, 245, ${b.opacity * 0.5})`;
      ctx.fill();

      b.y -= b.speed;
      b.x += b.drift;
      if (b.y + b.r < 0) Object.assign(b, randomBubble());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      bubbles.forEach(drawBubble);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
