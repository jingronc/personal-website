  <style>
    .thoughts-page {
      min-height: 100vh;
      padding: 5rem 0 6rem;
      position: relative;
      overflow: hidden;
    }

    .page-header {
      text-align: center;
      margin-bottom: 2.5rem;

      z-index: 1;

    .page-header .section-title {

    }

    .page-header .page-sub {
      color: var(--text-muted);
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      letter-spacing: 0.04em;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3rem;
      transition: color 0.2s;
      text-decoration: none;
      position: relative;
      z-index: 1;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { width: 15px; height: 15px; }

    /* ── Masonry columns ── */
    .post-grid {
      columns: 3;
      column-gap: 1.25rem;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 800px) { .post-grid { columns: 2; } }
    @media (max-width: 480px) { .post-grid { columns: 1; } }

    /* Varied image heights — the casual look */
    .post-card--diving     .post-card-img { height: 400px; }
    .post-card--gamedesign .post-card-img { height: 240px; }
    .post-card--bookreview .post-card-img { height: 180px; }
    .post-card--life       .post-card-img { height: 300px; }

    /* ── Post card ── */
    .post-card {
      break-inside: avoid;
      margin-bottom: 1.25rem;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(20px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition:
        opacity 0.55s ease,
        transform 0.55s ease,
        box-shadow 0.3s ease;
    }

    .post-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .post-card:hover {
      box-shadow: 0 10px 36px rgba(0,0,0,0.45);
      transform: translateY(-4px);
    }

    .post-card.visible:hover {
      transform: translateY(-4px);
    }

    .post-card-img {
      background-size: cover;
      background-position: center;
      transition: transform 0.5s ease;
    }

    .post-card:hover .post-card-img {
      transform: scale(1.03);
    }

    /* Light cream body below image */
    .post-card-body {
      background: #faf8f4;
      padding: 1.1rem 1.3rem 1.2rem;
      flex-shrink: 0;
    }

    .post-title {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 600;
      color: #1a1a1a;
      line-height: 1.35;
      margin: 0 0 0.6rem;
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .post-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-diving     { background: #3AAFA9; }
    .dot-gamedesign { background: #9b5de5; }
    .dot-bookreview { background: #e0a020; }
    .dot-life       { background: #43AA8B; }

    .post-meta-text {
      font-size: 0.75rem;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.03em;
    }

    /* Stagger */
    .post-card:nth-child(1) { transition-delay: 0.05s; }
    .post-card:nth-child(2) { transition-delay: 0.12s; }
    .post-card:nth-child(3) { transition-delay: 0.19s; }
    .post-card:nth-child(4) { transition-delay: 0.26s; }

  <script>
    // ── Hamburger ──
    const hamburger   = document.getElementById('hamburger');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuLinks   = document.querySelectorAll('.menu-link');

    hamburger.addEventListener('click', () => {
      const isOpen = menuOverlay.classList.toggle('is-open');
      hamburger.classList.toggle('is-open', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });
    menuLinks.forEach(link => {
      link.addEventListener('click', () => {
        menuOverlay.classList.remove('is-open');
        hamburger.classList.remove('is-open');
        document.body.style.overflow = '';
      });
    });

    // ── Scroll reveal ──
    const cards = document.querySelectorAll('.post-card');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });
    cards.forEach(card => observer.observe(card));

    // ── Bubbles ──
    const canvas = document.getElementById('bubbleCanvas');
    const ctx    = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize, { passive: true });

    function randomBubble() {
      return {
        x:       Math.random() * canvas.width,
        y:       canvas.height + Math.random() * 200,
        r:       Math.random() * 3 + 1,
        speed:   Math.random() * 0.5 + 0.2,
        opacity: Math.random() * 0.35 + 0.05,
        drift:   (Math.random() - 0.5) * 0.4,
      };
    }

    const bubbles = [];
    for (let i = 0; i < 80; i++) {
      const b = randomBubble();
      b.y = Math.random() * canvas.height;
      bubbles.push(b);
    }

    function drawBubble(b) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(94, 207, 218, ${b.opacity})`;
      ctx.lineWidth   = 0.8;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180, 240, 245, ${b.opacity * 0.5})`;
      ctx.fill();
      b.y -= b.speed;
      b.x += b.drift;
      if (b.y + b.r < 0) Object.assign(b, randomBubble());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      bubbles.forEach(drawBubble);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
